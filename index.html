    <!--
      Applies a stored / system theme before first paint to avoid a flash of the
      wrong palette. Kept intentionally tiny and dependency-free.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('rahul-os:theme')
          var motion = localStorage.getItem('rahul-os:motion')
          var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          var theme = stored === 'light' || stored === 'dark' ? stored : system
          document.documentElement.dataset.theme = theme
          if (motion === 'off') document.documentElement.dataset.motion = 'off'
        } catch (e) {
          /* private mode — fall back to the dark default */
        }
      })()
    </script>
